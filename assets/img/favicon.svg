<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Just the E. No logo, no mark, no enclosing shape. Drawn as paths rather
       than set in Atkinson because a favicon cannot load a webfont: an SVG used
       as an icon has external resources blocked. The proportions follow the
       typeface it stands in for, uniform stroke and open counters. -->
  <g fill="#B4441A">
    <rect x="7" y="4" width="4.6" height="24"/>
    <rect x="7" y="4" width="17" height="4.4"/>
    <rect x="7" y="13.8" width="13.6" height="4.4"/>
    <rect x="7" y="23.6" width="17" height="4.4"/>
  </g>
</svg>
